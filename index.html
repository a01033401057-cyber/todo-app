<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>오늘의 할 일</title>
  <meta name="theme-color" content="#F5F6F8">
  <!-- manifest 링크는 file://에서 CORS 오류가 나므로 app.js가 http/https일 때만 추가한다 -->
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="할 일">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <!-- 1. 헤더: 앱 이름 + 날짜 이동 -->
    <header class="header">
      <h1 class="title">오늘의 할 일</h1>
      <div class="date-nav">
        <button class="btn nav-btn" id="prev-day" type="button" aria-label="이전 날">‹</button>
        <h2 class="current-date" id="current-date" aria-live="polite"></h2>
        <button class="btn nav-btn" id="next-day" type="button" aria-label="다음 날">›</button>
        <button class="btn" id="go-today" type="button">오늘</button>
      </div>
    </header>

    <!-- 2. 진행률 영역 (보고 있는 날짜 기준) -->
    <section class="progress" aria-label="진행률">
      <div class="progress-bar" id="progress-bar" role="progressbar" aria-label="전체 진행률"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <p class="progress-text" id="progress-text" aria-live="polite">0/0 완료 (0%)</p>
      <p class="celebrate" id="celebrate" hidden></p>
      <!-- 카테고리별 미니 진행률: app.js가 8개 카테고리로 채운다 -->
      <ul class="mini-progress" id="mini-progress"></ul>
    </section>

    <!-- 3. 입력 영역 -->
    <form class="add-form" id="add-form">
      <label class="visually-hidden" for="add-input">할 일 내용</label>
      <input class="add-input" id="add-input" type="text" maxlength="100" placeholder="할 일을 입력하세요" autocomplete="off">
      <label class="visually-hidden" for="add-category">카테고리</label>
      <select class="add-category" id="add-category"></select>
      <button class="btn" id="add-detail" type="button">자세히</button>
      <button class="btn btn-primary" type="submit">추가</button>
    </form>

    <!-- 4. 필터 칩: app.js가 전체 + 8개 카테고리로 채운다 -->
    <nav class="filters" id="filters" aria-label="카테고리 필터"></nav>

    <!-- 5. 할 일 목록 -->
    <ul class="todo-list" id="todo-list" aria-label="할 일 목록"></ul>
    <p class="empty" id="empty-message" hidden></p>

    <!-- 6. 하단 -->
    <footer class="footer">
      <button class="btn btn-danger" id="clear-completed" type="button">완료 항목 삭제</button>
      <p class="notice">데이터는 이 브라우저에만 저장됩니다. 브라우저 데이터를 지우면 함께 삭제돼요.</p>
    </footer>
  </main>

  <!-- 7. 편집 창 (추가 '자세히'와 수정에 함께 사용) -->
  <dialog class="editor" id="editor" aria-labelledby="editor-title">
    <form class="editor-form" id="editor-form" novalidate>
      <h2 class="editor-title" id="editor-title">할 일 수정</h2>

      <div class="field">
        <label for="f-title">할 일</label>
        <input id="f-title" type="text" maxlength="100" autocomplete="off" required>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="f-cat">카테고리</label>
          <select id="f-cat"></select>
        </div>
        <div class="field">
          <label for="f-sub">세부 항목</label>
          <input id="f-sub" type="text" maxlength="30" list="f-sub-list" autocomplete="off" placeholder="직접 입력">
          <datalist id="f-sub-list"></datalist>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="f-time">시작 시간 (선택)</label>
          <input id="f-time" type="time">
        </div>
        <div class="field">
          <label for="f-dur">예상 소요 시간</label>
          <select id="f-dur"></select>
        </div>
      </div>

      <div class="field">
        <label for="f-memo">메모 (선택)</label>
        <input id="f-memo" type="text" maxlength="200" autocomplete="off">
      </div>

      <label class="check-line">
        <input id="f-fixed" type="checkbox">
        고정 일정 (수업·알바처럼 옮길 수 없는 일)
      </label>

      <p class="field-error" id="f-error" hidden>할 일 내용을 입력해 주세요.</p>

      <div class="editor-actions">
        <button class="btn" id="f-cancel" type="button">취소</button>
        <button class="btn btn-primary" id="f-submit" type="submit">저장</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
