<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 할 일</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <!-- 1. 헤더 -->
    <header class="header">
      <h1 class="title">오늘의 할 일</h1>
      <p class="today" id="today"></p>
    </header>

    <!-- 2. 진행률 영역 -->
    <section class="progress" aria-label="진행률">
      <div class="progress-bar" id="progress-bar" role="progressbar" aria-label="전체 진행률"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <p class="progress-text" id="progress-text" aria-live="polite">0/0 완료 (0%)</p>
      <p class="celebrate" id="celebrate" hidden>오늘 할 일을 모두 끝냈어요!</p>
      <ul class="mini-progress">
        <li class="mini" data-category="work">
          <span class="mini-label">업무</span>
          <div class="mini-bar"><div class="mini-fill"></div></div>
          <span class="mini-text">0/0 (0%)</span>
        </li>
        <li class="mini" data-category="personal">
          <span class="mini-label">개인</span>
          <div class="mini-bar"><div class="mini-fill"></div></div>
          <span class="mini-text">0/0 (0%)</span>
        </li>
        <li class="mini" data-category="study">
          <span class="mini-label">공부</span>
          <div class="mini-bar"><div class="mini-fill"></div></div>
          <span class="mini-text">0/0 (0%)</span>
        </li>
      </ul>
    </section>

    <!-- 3. 입력 영역 -->
    <form class="add-form" id="add-form">
      <label class="visually-hidden" for="add-input">할 일 내용</label>
      <input class="add-input" id="add-input" type="text" maxlength="100" placeholder="할 일을 입력하세요" autocomplete="off">
      <label class="visually-hidden" for="add-category">카테고리</label>
      <select class="add-category" id="add-category">
        <option value="work">업무</option>
        <option value="personal">개인</option>
        <option value="study">공부</option>
      </select>
      <button class="btn btn-primary" type="submit">추가</button>
    </form>

    <!-- 4. 필터 탭 -->
    <nav class="filters" id="filters" aria-label="카테고리 필터">
      <button class="filter is-active" type="button" data-filter="all" aria-pressed="true">전체</button>
      <button class="filter" type="button" data-filter="work" aria-pressed="false">업무</button>
      <button class="filter" type="button" data-filter="personal" aria-pressed="false">개인</button>
      <button class="filter" type="button" data-filter="study" aria-pressed="false">공부</button>
    </nav>

    <!-- 5. 할 일 목록 -->
    <ul class="todo-list" id="todo-list" aria-label="할 일 목록"></ul>
    <p class="empty" id="empty-message" hidden></p>

    <!-- 6. 하단 -->
    <footer class="footer">
      <button class="btn btn-danger" id="clear-completed" type="button">완료 항목 삭제</button>
      <p class="notice">데이터는 이 브라우저에만 저장됩니다. 브라우저 데이터를 지우면 함께 삭제돼요.</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
