<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>오늘의 할 일</title>
  <meta name="theme-color" content="#F5F6F8">
  <!-- manifest 링크는 file://에서 CORS 오류가 나므로 app.js가 http/https일 때만 추가한다 -->
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="할 일">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- 1. 헤더 -->
    <header class="topbar">
      <h1 class="title">오늘의 할 일</h1>
      <div class="top-actions">
        <button class="link-btn" id="open-settings" type="button">설정</button>
      </div>
    </header>

    <!-- 2. 기간 이동 -->
    <div class="nav">
      <button class="btn nav-btn" id="prev" type="button" aria-label="이전 날">‹</button>
      <button class="btn nav-btn" id="next" type="button" aria-label="다음 날">›</button>
      <button class="btn" id="go-today" type="button">오늘</button>
      <h2 class="period" id="period" aria-live="polite"><span id="period-title"></span><small id="period-sub"></small></h2>
    </div>

    <!-- 3. 카테고리 필터 칩 (app.js가 채운다) -->
    <nav class="filters" id="filters" aria-label="카테고리 필터"></nav>

    <!-- 4. 화면: 사이드 + 본문 (app.js가 채운다) -->
    <div class="layout">
      <aside class="stack side" id="side"></aside>
      <main class="stack main" id="main"></main>
    </div>

    <footer class="footer">
      <p class="notice">데이터는 이 브라우저에만 저장됩니다. 브라우저 데이터를 지우면 함께 삭제돼요.</p>
    </footer>
  </div>

  <!-- 편집 창 (추가 '자세히'와 수정에 함께 사용) -->
  <dialog class="sheet" id="editor" aria-labelledby="editor-title">
    <form class="sheet-form" id="editor-form" novalidate>
      <h2 class="sheet-title" id="editor-title">할 일 수정</h2>

      <div class="field">
        <label for="f-title">할 일 (끝났는지 알 수 있게)</label>
        <input id="f-title" type="text" maxlength="100" autocomplete="off" placeholder="예: 토익 단어 100개 암기 + 복습 테스트">
      </div>

      <div class="field-row">
        <div class="field">
          <label for="f-date">날짜</label>
          <input id="f-date" type="date">
        </div>
        <div class="field">
          <label for="f-time">시작 시간 (선택)</label>
          <input id="f-time" type="time">
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="f-cat">카테고리</label>
          <select id="f-cat"></select>
        </div>
        <div class="field">
          <label for="f-sub">세부 항목</label>
          <input id="f-sub" type="text" maxlength="30" list="f-sub-list" autocomplete="off" placeholder="직접 입력">
          <datalist id="f-sub-list"></datalist>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="f-dur">예상 소요 시간</label>
          <select id="f-dur"></select>
        </div>
        <label class="check-line field-check">
          <input id="f-fixed" type="checkbox">
          고정 일정 (수업·알바처럼 옮길 수 없는 일)
        </label>
      </div>

      <div class="field">
        <label for="f-memo">메모 (선택)</label>
        <input id="f-memo" type="text" maxlength="200" autocomplete="off">
      </div>

      <p class="field-error" id="f-error" hidden>할 일 내용을 입력해 주세요.</p>

      <div class="sheet-actions">
        <button class="btn btn-danger" id="f-delete" type="button">삭제</button>
        <span class="spacer"></span>
        <button class="btn" id="f-cancel" type="button">취소</button>
        <button class="btn btn-primary" id="f-submit" type="submit">저장</button>
      </div>
    </form>
  </dialog>

  <!-- 설정 창 -->
  <dialog class="sheet" id="settings" aria-labelledby="settings-title">
    <form class="sheet-form" id="settings-form" novalidate>
      <h2 class="sheet-title" id="settings-title">설정</h2>

      <div class="field-row">
        <div class="field">
          <label for="s-golden-start">골든 타임 시작</label>
          <input id="s-golden-start" type="time">
        </div>
        <div class="field">
          <label for="s-golden-end">골든 타임 끝</label>
          <input id="s-golden-end" type="time">
        </div>
      </div>

      <div class="field">
        <label for="s-routine">아침 루틴 (한 줄에 하나, 최대 10개)</label>
        <textarea id="s-routine" rows="4"></textarea>
      </div>

      <div class="field">
        <label for="s-week-hours">한 주 기본 가용 시간 (시간)</label>
        <input id="s-week-hours" type="number" min="1" max="120" inputmode="numeric">
        <span class="field-hint">고정 일정을 빼고 내가 쓸 수 있는 시간이에요.</span>
      </div>

      <p class="field-error" id="s-error" hidden></p>

      <div class="sheet-actions">
        <span class="spacer"></span>
        <button class="btn" id="s-cancel" type="button">취소</button>
        <button class="btn btn-primary" type="submit">저장</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- 스크립트: 일반 <script>로 순서대로 (ES 모듈은 file://에서 동작하지 않음) -->
  <script src="js/core.js"></script>
  <script src="js/parts.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/day.js"></script>
  <script src="app.js"></script>
</body>
</html>
